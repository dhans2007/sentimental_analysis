<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}feeling? — Sentiment &amp; Tone Intelligence{% endblock %}</title>
  <meta name="description" content="Estimate tone and sentiment with multi-model NLP, aspect extraction, emotion analysis, and interactive explainability." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js CDN for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- Theme & Custom CSS Stylesheets -->
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="min-h-screen flex flex-col bg-[var(--color-bg)] text-[var(--color-text)] font-sans antialiased">
  <!-- Header & Navigation -->
  <header class="site-header sticky top-0 z-50">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3.5 sm:px-8 gap-4" aria-label="Main navigation">
      <a href="/" class="flex items-center gap-3 no-underline flex-shrink-0" aria-label="feeling? home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M4 14.5c2.3 0 2.3-5 4.6-5s2.3 5 4.6 5 2.3-5 4.6-5S20.1 12 22 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M3 19h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <span class="font-bold text-lg tracking-tight text-[var(--color-text)]" style="font-family:var(--font-heading)">feeling<span style="color:var(--color-muted)">?</span></span>
      </a>

      <!-- Navigation Links -->
      <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto py-1" id="main-nav">
        <a href="/" class="nav-item {% if active_page == 'analyze' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Analyzer</span>
        </a>
        <a href="/batch" class="nav-item {% if active_page == 'batch' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Batch</span>
        </a>
        <a href="/assistant" class="nav-item {% if active_page == 'assistant' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Responder</span>
        </a>
        <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="/url-analyzer" class="nav-item {% if active_page == 'url-analyzer' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>URL</span>
        </a>
        <a href="/history" class="nav-item {% if active_page == 'history' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>History</span>
        </a>
        <a href="/how-it-works" class="nav-item {% if active_page == 'how-it-works' %}active{% endif %}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Guide</span>
        </a>
      </div>

      <!-- Theme Controls -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <svg id="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="theme-icon-moon" class="hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Page Body -->
  <main class="mx-auto max-w-6xl px-5 py-8 sm:px-8 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer-line mt-auto">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-6 text-xs muted sm:px-8">
      <span>Made for the meaning between the words.</span>
      <div class="flex items-center gap-5">
        <a href="/how-it-works" class="no-underline text-xs muted transition hover:text-[var(--color-text)]">How it works</a>
        <a href="/" class="no-underline text-xs muted transition hover:text-[var(--color-text)]">feeling? home</a>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Shared Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
